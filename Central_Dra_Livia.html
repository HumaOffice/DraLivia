<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dra. Livia Horovitz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3a2436;
    --brown:#8f2f83;        /* roxo primario */
    --brown-deep:#5c2b56;   /* ameixa profundo */
    --tan:#b07b84;          /* rose accent */
    --cream:#faf4f8;
    --card:#ffffff;
    --sage:#a85f77;         /* rose empoeirado (WhatsApp/tokens) */
    --sage-soft:#f7e9ef;
    --line:#ecdae6;
    --chip:#f4e6f0;
    --shadow:0 1px 2px rgba(92,43,86,.06),0 8px 24px rgba(92,43,86,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Figtree',system-ui,-apple-system,sans-serif;color:var(--ink);
    background:var(--cream);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:var(--brown)}
  .topbar{position:sticky;top:0;z-index:20;background:var(--cream);
    border-bottom:1px solid var(--line);padding:12px 16px 11px;}
  .topbar img{display:block;margin:2px auto 6px;max-width:120px;width:32%;height:auto;
    border-radius:50%;box-shadow:0 4px 16px rgba(92,43,86,.18)}
  .app-title{font-family:'Cormorant Garamond',serif;font-weight:600;text-align:center;
    color:var(--brown-deep);font-size:1.24rem;letter-spacing:.04em;margin:0 0 2px;}
  .app-sub{text-align:center;color:var(--tan);font-size:.72rem;letter-spacing:.16em;
    text-transform:uppercase;margin:0 0 11px;font-weight:600}
  .wrap{max-width:1120px;margin:0 auto}
  .fields-main,.fields-more{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .fields-more{margin-bottom:10px}
  .field-wide{margin-bottom:10px}
  .field label{display:block;font-size:.66rem;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--tan);margin-bottom:4px;}
  .field input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;
    background:var(--card);color:var(--ink);font-family:inherit;font-size:.92rem;
    transition:border-color .15s,box-shadow .15s;}
  .field input:focus{outline:none;border-color:var(--brown);box-shadow:0 0 0 3px rgba(143,47,131,.12);}
  .field.key input{border-color:var(--brown);background:#fffcfe}
  .search{position:relative}
  .search input{width:100%;padding:9px 11px 9px 34px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);font-family:inherit;font-size:.92rem;color:var(--ink);}
  .search input:focus{outline:none;border-color:var(--brown);box-shadow:0 0 0 3px rgba(143,47,131,.12)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--tan)}
  .more-toggle{display:inline-flex;align-items:center;gap:6px;margin-top:11px;padding:7px 13px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--brown);
    font-family:inherit;font-weight:600;font-size:.82rem;cursor:pointer;transition:all .14s;}
  .more-toggle:hover{border-color:var(--tan)}
  .more-toggle .chev{width:15px;height:15px;transition:transform .22s}
  .more-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .more-panel{max-height:0;overflow:hidden;transition:max-height .28s ease}
  .more-panel.open{max-height:520px}
  .more-inner{padding-top:11px}
  .pills{display:flex;gap:7px;flex-wrap:nowrap;margin-top:11px;overflow-x:auto;overflow-y:hidden;
    padding-bottom:4px;touch-action:pan-x;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .pills::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--brown);
    font-family:inherit;font-size:.82rem;font-weight:600;padding:7px 13px;border-radius:999px;
    cursor:pointer;transition:all .14s;white-space:nowrap;}
  .pill:hover{border-color:var(--tan)}
  .pill.active{background:var(--brown);color:#fff;border-color:var(--brown)}
  main{max-width:1120px;margin:0 auto;padding:22px 16px 60px}
  .group{margin-bottom:30px}
  .group-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 14px}
  .group-head h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.72rem;
    color:var(--brown-deep);margin:0;letter-spacing:.01em;}
  .group-head .count{font-size:.78rem;color:var(--tan);font-weight:500}
  .group-note{font-size:.82rem;color:var(--tan);margin:-6px 2px 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%, 300px),1fr));gap:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 16px 14px;display:flex;flex-direction:column;box-shadow:var(--shadow);}
  .card .eyebrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;}
  .card .eb-label{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--brown);display:flex;align-items:center;gap:7px;min-width:0;}
  .card .eb-label::before{content:"";width:14px;height:1.5px;background:var(--tan);border-radius:2px;flex:0 0 auto}
  .edited-tag{font-style:italic;text-transform:none;letter-spacing:0;font-weight:500;color:var(--sage);font-size:.9em}
  .icon-edit{flex:0 0 auto;background:none;border:none;cursor:pointer;color:var(--tan);
    padding:3px;border-radius:7px;display:inline-flex;transition:color .14s,background .14s;}
  .icon-edit:hover{color:var(--brown);background:var(--chip)}
  .icon-edit svg{width:16px;height:16px}
  .card.edited{border-color:#e7cfe0}
  .edit-area{width:100%;min-height:160px;resize:vertical;border:1px solid var(--brown);
    border-radius:12px;padding:11px;font-family:inherit;font-size:.9rem;color:var(--ink);
    line-height:1.5;background:#fffcfe;margin-bottom:8px;}
  .edit-area:focus{outline:none;box-shadow:0 0 0 3px rgba(143,47,131,.12)}
  .edit-hint{font-size:.72rem;color:var(--tan);margin-bottom:11px;line-height:1.4}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--brown)}
  .btn-ghost:hover{border-color:var(--tan)}
  .msg{white-space:pre-wrap;font-size:.93rem;color:#4a3242;flex:1;margin-bottom:13px;
    overflow-wrap:anywhere;word-break:break-word;}
  .msg .q{display:block;border-left:3px solid var(--tan);padding:2px 0 2px 10px;margin:3px 0;color:#5a4152;}
  .msg i{font-style:italic}
  .msg b{font-weight:700;color:var(--brown-deep)}
  .msg .tok{background:var(--chip);color:var(--brown-deep);padding:1px 6px;border-radius:6px;
    font-weight:600;border:1px solid #e7cfe0;}
  .msg .tok.empty{background:var(--sage-soft);color:var(--sage);border-color:#eccdd9;font-style:italic}
  .cardbtns{display:flex;gap:8px}
  .btn{font-family:inherit;font-weight:600;font-size:.85rem;border-radius:10px;cursor:pointer;
    padding:9px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:all .14s;border:1px solid transparent;}
  .btn svg{width:15px;height:15px}
  .btn-copy{flex:1;background:var(--brown);color:#fff}
  .btn-copy:hover{background:var(--brown-deep)}
  .btn-copy.done{background:var(--sage)}
  .btn-wa{background:#fff;border-color:var(--line);color:#2aa81f;padding:9px 11px}
  .btn-wa:hover{border-color:#2aa81f;background:#eafae8}
  .empty-state{text-align:center;color:var(--tan);padding:50px 20px;font-size:.95rem}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--brown-deep);color:#fff;padding:11px 20px;border-radius:999px;font-size:.9rem;
    font-weight:500;box-shadow:0 8px 30px rgba(92,43,86,.28);opacity:0;pointer-events:none;
    transition:all .25s;z-index:50;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{text-align:center;padding:26px 20px 44px;border-top:1px solid var(--line);margin-top:20px}
  .foot-brand{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--brown);font-weight:600;letter-spacing:.05em}
  .foot-contact{color:var(--brown-deep);font-size:.86rem;margin-top:3px;font-weight:500}
  .foot-note{color:var(--tan);font-size:.76rem;margin:10px auto 0;max-width:560px;line-height:1.45}
  @media (max-width:560px){.group-head h2{font-size:1.5rem}.topbar img{max-width:96px;width:34%;margin-bottom:6px}.topbar{padding:10px 14px 10px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}


  /* ---- Mensagens autorais da Dra. (tom de roxo) ---- */
  .card.official{background:#efe6f6;border-color:#dcc9ec;box-shadow:0 1px 2px rgba(92,43,86,.06),0 8px 24px rgba(92,43,86,.08)}
  .card.official{border-left:4px solid #6b3d80}
  .card.official .eb-label{color:#6d3f86}
  .card.official .eb-label::before{background:#a487c0}
  .badge-dra{display:inline-flex;align-items:center;gap:4px;background:#e3d3f0;color:#5c2b56;
    border:1px solid #d3bfe6;font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 8px;border-radius:999px;margin-left:6px;white-space:nowrap}
  .card.official .msg b{color:#5c2b56}
  .card.official .btn-copy{background:#6b3d80}
  .card.official .btn-copy:hover{background:#552f66}
  .card.official .msg .tok{background:#e3d3f0;border-color:#d3bfe6;color:#5c2b56}

  /* ---- Swipe (versão organizada / original) nas mensagens da Dra. ---- */
  .swipe{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;margin:2px -4px 0;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .swipe::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:start;padding:0 4px;display:flex;flex-direction:column;min-width:0}
  .slidehead{font-size:.64rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    margin-bottom:7px;display:inline-flex;align-items:center;gap:6px}
  .slide.improved .slidehead{color:#6b3d80}
  .slide.orig .slidehead{color:#9a86ab}
  .slide.orig .slidehead::before{content:"";width:12px;height:1.5px;background:#c9b6dd;border-radius:2px}
  .slide.improved .slidehead::before{content:"";width:12px;height:1.5px;background:#a487c0;border-radius:2px}
  .dots{display:flex;gap:5px;justify-content:center;margin-top:9px;align-items:center}
  .dots span{width:6px;height:6px;border-radius:50%;background:#d3bfe6;transition:all .2s}
  .dots span.on{background:#6b3d80;width:16px;border-radius:6px}
  .swipehint{font-size:.66rem;color:#9a86ab;text-align:center;margin-top:5px}
  .slide .msg{margin-bottom:11px}

  /* ---- Topbar compacta ao rolar (mobile) ---- */
  .topbar{transition:padding .2s ease}
  .topbar img{transition:max-width .25s ease,opacity .2s ease,margin .25s ease,transform .25s ease}
  @media (max-width:640px){
    .topbar.compact{padding:8px 14px 8px}
    .topbar.compact img{max-height:0;max-width:0;opacity:0;margin:0;transform:scale(.6);overflow:hidden}
    .topbar.compact .app-title{font-size:1rem;margin:0 0 1px}
    .topbar.compact .app-sub{display:none}
    .topbar.compact .fields-main{grid-template-columns:1fr 1fr;gap:7px}
    .topbar.compact .fields-main .field:nth-child(3){display:none}
    .topbar.compact .field label{font-size:.58rem;margin-bottom:2px}
    .topbar.compact .field input{padding:7px 9px;font-size:.86rem}
    .topbar.compact .more-toggle{margin-top:7px;padding:5px 11px;font-size:.76rem}
    .topbar.compact .pills{margin-top:8px}
  }

  /* ---- Card de Pix (uso interno) ---- */
  .badge-int{display:inline-flex;align-items:center;gap:4px;background:#f3dbe1;color:#8a2f45;
    border:1px solid #e6bfca;font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 8px;border-radius:999px;margin-left:6px;white-space:nowrap}
  .intnote{background:#f6e3e8;border:1px solid #e8c8d0;border-left:3px solid #a33b52;border-radius:9px;
    padding:9px 12px;font-size:.82rem;color:#6e3444;margin-bottom:12px;line-height:1.45}
  .intnote b{color:#8a2f45;font-weight:700}
  .pixblock{border-top:1px dashed var(--line);padding-top:11px;margin-top:11px}
  .pixblock:first-of-type{border-top:none;padding-top:0;margin-top:0}
  .pixblock .slidehead{font-size:.64rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:#5f8168;margin-bottom:6px;display:block}

  /* ---- Guia da secretária (cards de consulta, uso interno) ---- */
  .infocard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent,#b07b84);
    border-radius:15px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .infocard .ihead{display:flex;align-items:center;gap:11px;padding:12px 14px 11px;background:var(--tint,#f7edf4)}
  .infocard .iemoji{width:36px;height:36px;border-radius:11px;background:#fff;display:flex;align-items:center;
    justify-content:center;font-size:19px;flex:0 0 auto;border:1px solid rgba(0,0,0,.05)}
  .infocard .ititle{font-weight:700;font-size:.98rem;color:var(--brown-deep);line-height:1.2}
  .infocard .ibody{padding:6px 15px 11px}
  .infocard ul{list-style:none;margin:0;padding:0}
  .infocard li{position:relative;padding:6px 0 6px 15px;font-size:.88rem;color:#4a3242;line-height:1.4;
    border-bottom:1px solid #f4ecf1}
  .infocard li:last-child{border-bottom:none}
  .infocard li::before{content:"";position:absolute;left:2px;top:12px;width:5px;height:5px;border-radius:50%;
    background:var(--accent,#b07b84)}
  .infocard li b{color:var(--brown-deep);font-weight:700}
  .c-rose{--accent:#d98f99;--tint:#fae8ea}
  .c-sage{--accent:#8fae97;--tint:#e7f0e8}
  .c-lav{--accent:#a487c0;--tint:#eee9f6}
  .c-peach{--accent:#e0a06f;--tint:#fbe9dc}
  .c-sky{--accent:#7ba7ba;--tint:#e6f1f4}
  .c-butter{--accent:#d8b64e;--tint:#faf1d5}
  .c-plum{--accent:#8f2f83;--tint:#f4e6f0}
  .c-alert{--accent:#d64545;--tint:#fbe4e4}
  .infocard.c-alert .ititle{color:#b02a2a}

  /* ---- Chips dentro dos cards do guia ---- */
  .ichips{display:flex;flex-wrap:wrap;gap:7px;padding:4px 15px 10px}
  .ichip{display:flex;flex-direction:column;gap:1px;background:var(--tint,#f7edf4);
    border:1px solid rgba(0,0,0,.06);border-left:3px solid var(--accent,#b07b84);
    border-radius:9px;padding:6px 10px;min-width:78px}
  .ichip .k{font-size:.66rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--brown-deep)}
  .ichip .v{font-size:.86rem;color:#4a3242;font-weight:600}
  .infocard.c-alert .ichip .k{color:#b02a2a}


  /* ---- Navegação do swipe (setas embaixo, fora do texto) ---- */
  .swipe-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
  .swnav{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;
    color:var(--brown);font-size:1.05rem;line-height:1;cursor:pointer;display:flex;align-items:center;
    justify-content:center;padding:0;transition:all .14s}
  .swnav:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
  .swipe-nav .dots{display:flex;gap:6px;margin:0}
  .dots span{cursor:pointer}

  /* compact-desktop: encolher cabeçalho ao rolar (todas as larguras) */
  .topbar.compact{padding:8px 16px 8px}
  .topbar.compact img{max-height:0;max-width:0;opacity:0;margin:0;overflow:hidden;transform:scale(.5)}
  .topbar.compact .app-title{font-size:1.02rem;margin:0 0 1px}
  .topbar.compact .app-sub{display:none}
  .topbar.compact .field label{font-size:.6rem;margin-bottom:2px}
  .topbar.compact .field input{padding:7px 10px;font-size:.88rem}
  .topbar.compact .more-toggle{margin-top:8px;padding:5px 12px}
  .topbar.compact .pills{margin-top:8px}
</style>
</head>

  {key:"assistente", label:"seu nome"},
  {key:"paciente",   label:"nome da paciente"},

const EDIT_KEY = "livia_msg_edits_v1";
let edits = {};

try { const raw = localStorage.getItem(EDIT_KEY); if(raw){ edits = JSON.parse(raw) || {}; } } catch(e){ edits = {}; }
function saveEdits(){ try { localStorage.setItem(EDIT_KEY, JSON.stringify(edits)); } catch(e){} }
function getText(idx){ return (idx in edits) ? edits[idx] : MSGS[idx].text; }
function commitEdit(idx, val){
  if(val.trim() === MSGS[idx].text.trim()){ delete edits[idx]; }
  else { edits[idx] = val; }
  saveEdits();
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
const HEADER = "*Equipe Dra. Livia Horovitz*\n\n";

function resolvePlain(text, off){
  let t = (off ? "" : HEADER) + text;
  TOKENS.forEach(tok=>{
    const v = state[tok.key].trim();
    t = t.split("{"+tok.key+"}").join(v ? v : "["+tok.label+"]");
  });
  return t;
}
function resolveHtml(text, off){
  let t = esc((off ? "" : HEADER) + text);
  TOKENS.forEach(tok=>{
    const v = state[tok.key].trim();
    const chip = v ? '<span class="tok">'+esc(v)+'</span>' : '<span class="tok empty">['+tok.label+']</span>';
    t = t.split("{"+tok.key+"}").join(chip);
  });
  t = t.replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
  t = t.replace(/_([^_\n]+)_/g, "<i>$1</i>");
  const lines = t.split("\n");
  const out = []; let quote = [];
  const flush = () => { if(quote.length){ out.push('<span class="q">'+quote.join("<br>")+'</span>'); quote=[]; } };
  lines.forEach(ln=>{
    const m = ln.match(/^&gt;\s?(.*)$/);
    if(m){ quote.push(m[1]); } else { flush(); out.push(ln); }
  });
  flush();
  return out.join("\n");
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("show"),1600);
}
function copyText(text, btn){
  const done = ()=>{
    toast("Mensagem copiada ✅");
    const old = btn.innerHTML; btn.classList.add("done");
    btn.innerHTML = iconCheck()+" Copiado";
    setTimeout(()=>{btn.classList.remove("done");btn.innerHTML=old;},1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else { fallbackCopy(text,done); }
}
function fallbackCopy(text,cb){
  const ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");cb();}catch(e){toast("Não consegui copiar 😕");}
  document.body.removeChild(ta);
}

    let items = MSGS.filter(m=>m.cat===cid);
    if(q){ items = items.filter(m=>(m.label+" "+m.text).toLowerCase().includes(q)); }
    if(!items.length) return;
    total += items.length;
    const cat = CATS.find(c=>c.id===cid);
    const group = document.createElement("section");
    group.className="group";
    let head = '<div class="group-head"><h2>'+cat.label+'</h2><span class="count">'+items.length+'</span></div>';
    const NOTES = {
      "guia":"Guia rápido de consulta, uso interno. Não envie estes cards à paciente.",
      "autorais":"Textos exatos enviados pela Dra., prontos para copiar e enviar. Reconhecíveis pela cor e pelo selo.",
      "agenda":"A taxa de agendamento (presencial) é somente via Pix e desconta do valor da consulta.",
      "exames":"Cada análise microscópica é paga. Os exames do Sérgio Franco são cobrados pelo laboratório.",
      "pagamento":"Sempre conferir o comprovante. Registrar na planilha só quem pediu nota fiscal.",
      "confirma":"Confirmação nos dois formatos: presencial (Barra tem totem) e online.",
      "orienta":"Enviar antes da consulta e pedir que a paciente leia com atenção.",
      "retorno":"Retorno em até 30 dias. Sempre conferir no prontuário se é retorno, manutenção ou nova consulta.",
      "duvidas":"Respostas prontas para as dúvidas mais comuns. Questões clínicas ficam com a Dra.",
      "dados":"Informações rápidas para enviar quando a paciente precisar.",
      "followup":"Retomada leve para quem demonstrou interesse e sumiu, sem cobrança."
    };
    if(NOTES[cid]){ head += '<p class="group-note">'+NOTES[cid]+'</p>'; }
    let cards = '<div class="grid">';
    items.forEach((m)=>{
      const idx = MSGS.indexOf(m);
      const editedTag = (idx in edits) ? ' <em class="edited-tag">editada</em>' : '';
      if(editing === idx){
        const draft = (editDraft !== null) ? editDraft : getText(idx);
        cards += '<div class="card editing"><div class="eyebrow"><span class="eb-label">'+esc(m.label)+editedTag+'</span></div>'+
          '<textarea class="edit-area" id="edit-'+idx+'">'+esc(draft)+'</textarea>'+
          '<div class="edit-hint">Use {paciente}, {data}, {unidade} • *negrito*, _itálico_, &gt; citação</div>'+
          '<div class="cardbtns"><button class="btn btn-copy" data-save="'+idx+'">'+iconCheck()+' Salvar</button>'+
          '<button class="btn btn-ghost" data-cancel="'+idx+'">Cancelar</button>'+
          ((idx in edits) ? '<button class="btn btn-ghost" data-reset="'+idx+'">Restaurar</button>' : '')+'</div></div>';
      } else if(m.pix){
        cards += '<div class="card official has-swipe"><div class="eyebrow">'+
          '<span class="eb-label">'+esc(m.label)+' <span class="badge-int">Uso interno</span></span></div>'+
          '<div class="intnote">'+resolveHtml(m.note, true)+'</div>'+
          '<div class="pixblock"><span class="slidehead">'+esc(m.l1)+'</span>'+
            '<div class="msg">'+resolveHtml(m.t1, true)+'</div>'+
            '<div class="cardbtns"><button class="btn btn-copy" data-cp1="'+idx+'">'+iconCopy()+' Copiar</button>'+
            '<button class="btn btn-wa" data-wp1="'+idx+'" title="Abrir no WhatsApp">'+iconWa()+'</button></div></div>'+
          '<div class="pixblock"><span class="slidehead">'+esc(m.l2)+'</span>'+
            '<div class="msg">'+resolveHtml(m.t2, true)+'</div>'+
            '<div class="cardbtns"><button class="btn btn-copy" data-cp2="'+idx+'">'+iconCopy()+' Copiar</button>'+
            '<button class="btn btn-wa" data-wp2="'+idx+'" title="Abrir no WhatsApp">'+iconWa()+'</button></div></div>'+
          '</div>';
      } else if(m.off){
        cards += '<div class="card official has-swipe"><div class="eyebrow">'+
          '<span class="eb-label">'+esc(m.label)+' <span class="badge-dra">Texto da Dra.</span></span></div>'+
          '<div class="swipe">'+
            '<div class="slide improved"><div class="slidehead">\u2728 Vers\u00e3o organizada</div>'+
              '<div class="msg">'+resolveHtml(m.text, true)+'</div>'+
              '<div class="cardbtns"><button class="btn btn-copy" data-copy="'+idx+'">'+iconCopy()+' Copiar</button>'+
              '<button class="btn btn-wa" data-wa="'+idx+'" title="Abrir no WhatsApp">'+iconWa()+'</button></div></div>'+
            '<div class="slide orig"><div class="slidehead">Original</div>'+
              '<div class="msg">'+resolveHtml(m.orig, true)+'</div>'+
              '<div class="cardbtns"><button class="btn btn-copy" data-copyo="'+idx+'">'+iconCopy()+' Copiar</button>'+
              '<button class="btn btn-wa" data-wao="'+idx+'" title="Abrir no WhatsApp">'+iconWa()+'</button></div></div>'+
          '</div>'+
          '<div class="swipe-nav">'+
            '<button class="swnav" data-swprev aria-label="Anterior">\u2039</button>'+
            '<span class="dots"><span class="on" data-swgo="0"></span><span data-swgo="1"></span></span>'+
            '<button class="swnav" data-swnext aria-label="Próxima">\u203a</button>'+
          '</div>'+
          '<div class="swipehint">deslize ou use \u2039 \u203a</div>'+
          '</div>';
      } else {
        cards += '<div class="card'+((idx in edits)?' edited':'')+'"><div class="eyebrow">'+
          '<span class="eb-label">'+esc(m.label)+editedTag+'</span>'+
          '<button class="icon-edit" data-edit="'+idx+'" title="Editar mensagem">'+iconEdit()+'</button></div>'+
          '<div class="msg">'+resolveHtml(getText(idx), false)+'</div>'+
          '<div class="cardbtns"><button class="btn btn-copy" data-copy="'+idx+'">'+iconCopy()+' Copiar</button>'+
          '<button class="btn btn-wa" data-wa="'+idx+'" title="Abrir no WhatsApp">'+iconWa()+'</button></div></div>';
      }
    });
    cards += '</div>';
    group.innerHTML = head + cards;
    content.appendChild(group);
  });
  if(!total){ content.innerHTML = '<div class="empty-state">Nenhuma mensagem encontrada para essa busca.</div>'; }
  document.querySelectorAll('.swipe').forEach(sw=>{
    const dots = sw.parentElement.querySelector('.dots');
    if(!dots) return;
    sw.addEventListener('scroll',()=>{
      const i = Math.round(sw.scrollLeft / sw.clientWidth);
      dots.querySelectorAll('span').forEach((d,j)=>d.classList.toggle('on', j===i));
    },{passive:true});
  });
}
["assistente","paciente","data","unidade","endereco","fone"].forEach(id=>{
  document.getElementById(id).addEventListener("input",e=>{ state[id]=e.target.value; render(); });
});
document.getElementById("busca").addEventListener("input",e=>{ state.busca=e.target.value; editing=null; editDraft=null; render(); });
function buildPills(){
  const box=document.getElementById("pills");
  const all=[{id:"todos",label:"Todas"}].concat(CATS);
  box.innerHTML = all.map(c=>'<button class="pill'+(c.id===state.cat?' active':'')+'" data-cat="'+c.id+'">'+c.label+'</button>').join("");
  box.querySelectorAll(".pill").forEach(p=>{
    p.addEventListener("click",()=>{
      state.cat=p.dataset.cat; editing=null; editDraft=null;
      box.querySelectorAll(".pill").forEach(x=>x.classList.toggle("active",x===p));
      render();
    });
  });
}
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-copy]");
  const w=e.target.closest("[data-wa]");
  const ed=e.target.closest("[data-edit]");
  const sv=e.target.closest("[data-save]");
  const cn=e.target.closest("[data-cancel]");
  const rs=e.target.closest("[data-reset]");
  const co=e.target.closest("[data-copyo]");
  const wo=e.target.closest("[data-wao]");
  if(c){ const i=+c.dataset.copy; copyText(resolvePlain(getText(i), MSGS[i].off), c); }
  if(w){ const i=+w.dataset.wa; openWhats(resolvePlain(getText(i), MSGS[i].off)); }
  if(co){ const i=+co.dataset.copyo; copyText(resolvePlain(MSGS[i].orig, true), co); }
  if(wo){ const i=+wo.dataset.wao; openWhats(resolvePlain(MSGS[i].orig, true)); }
  const cp1=e.target.closest("[data-cp1]"); const wp1=e.target.closest("[data-wp1]");
  const cp2=e.target.closest("[data-cp2]"); const wp2=e.target.closest("[data-wp2]");
  if(cp1){ const i=+cp1.dataset.cp1; copyText(resolvePlain(MSGS[i].t1, true), cp1); }
  if(wp1){ const i=+wp1.dataset.wp1; openWhats(resolvePlain(MSGS[i].t1, true)); }
  if(cp2){ const i=+cp2.dataset.cp2; copyText(resolvePlain(MSGS[i].t2, true), cp2); }
  if(wp2){ const i=+wp2.dataset.wp2; openWhats(resolvePlain(MSGS[i].t2, true)); }
  const swp=e.target.closest("[data-swprev]"); const swn=e.target.closest("[data-swnext]"); const swg=e.target.closest("[data-swgo]");
  if(swp||swn||swg){
    const card=e.target.closest(".card"); const sw=card&&card.querySelector(".swipe"); if(sw){
      const w=sw.clientWidth; let i=Math.round(sw.scrollLeft/w);
      if(swp) i=Math.max(0,i-1); else if(swn) i=Math.min(1,i+1); else i=+swg.dataset.swgo;
      sw.scrollTo({left:i*w,behavior:"smooth"});
    }
  }
  if(ed){ editing = +ed.dataset.edit; editDraft = null; render(); const ta=document.getElementById("edit-"+editing); if(ta){ ta.focus(); } }
  if(sv){ const idx=+sv.dataset.save; const ta=document.getElementById("edit-"+idx); if(ta){ commitEdit(idx, ta.value); } editing=null; editDraft=null; render(); toast("Mensagem salva ✏️"); }
  if(cn){ editing=null; editDraft=null; render(); }
  if(rs){ const idx=+rs.dataset.reset; delete edits[idx]; saveEdits(); editing=null; editDraft=null; render(); toast("Texto original restaurado"); }
});
const moreToggle = document.getElementById("moreToggle");
const morePanel  = document.getElementById("morePanel");
const moreLabel  = document.getElementById("moreLabel");
moreToggle.addEventListener("click",()=>{
  const open = morePanel.classList.toggle("open");
  moreToggle.setAttribute("aria-expanded", open ? "true" : "false");
  moreLabel.textContent = open ? "Menos opções" : "Mais opções";
});
// topbar-scroll: encolhe o cabeçalho ao rolar (mobile)
(function(){
  const bar = document.querySelector('.topbar');
  let ticking = false;
  function upd(){
    const y = window.scrollY || document.documentElement.scrollTop;
    if(y > 60) bar.classList.add('compact'); else bar.classList.remove('compact');
    ticking = false;
  }
  window.addEventListener('scroll', ()=>{ if(!ticking){ requestAnimationFrame(upd); ticking = true; } }, {passive:true});
  upd();
})();
buildPills();
render();
</script>
