  .card{width:100%;max-width:450px;background:#fff;border-radius:24px;box-shadow:0 16px 44px rgba(92,43,86,.18);
    overflow:hidden;border:1px solid #f0e2ec;position:relative}
  .top{position:relative;background:linear-gradient(135deg,#6b3d80,#8f2f83);color:#fff;text-align:center;padding:26px 22px 22px;overflow:hidden}
  .top .deco{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
  .dec{transform-box:fill-box;transform-origin:center}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .f1{animation:floaty 6s ease-in-out infinite}.f2{animation:floaty 8s ease-in-out infinite;animation-delay:-2s}
  .f3{animation:sway 7s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.dec{animation:none}}
  .top .ring{position:relative;z-index:1;width:72px;height:72px;border-radius:50%;background:#fff;padding:4px;margin:0 auto 12px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
  .top .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  .top h1{position:relative;z-index:1;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.55rem}
  .top .sub{position:relative;z-index:1;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;opacity:.9;margin-top:3px;font-weight:600}
  .body{padding:20px}
  .greet{text-align:center;font-size:1.02rem;color:var(--plum-deep);font-weight:700;margin-bottom:14px}
  .greet span{color:var(--plum)}
  .tolbig{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,#fff0f0,#ffdede);
    border:2px solid #ef9a9a;border-radius:16px;padding:14px 15px;margin-bottom:16px;box-shadow:0 6px 18px rgba(214,69,69,.16)}
  .tolbig .ic{font-size:1.9rem;flex:0 0 auto;animation:floaty 1.6s ease-in-out infinite}
  .tolbig .tx{color:#b02a2a;font-weight:800;font-size:1.02rem;line-height:1.25}
  .tolbig .tx small{display:block;font-weight:600;font-size:.78rem;color:#a24; opacity:.9;margin-top:2px}
  .when{text-align:center;margin-bottom:16px}
  .when .d{font-family:'Cormorant Garamond',serif;font-size:1.7rem;color:var(--plum-deep);font-weight:600;line-height:1.12}
  .when .h{font-size:1.12rem;color:var(--plum);font-weight:800;margin-top:3px}
  .when .wd{display:inline-block;margin-top:6px;font-size:.72rem;color:#fff;background:var(--plum);
    text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:3px 12px;border-radius:999px}
  .row{display:flex;gap:10px;align-items:flex-start;background:#faf4f8;border:1px solid var(--line);
    border-radius:13px;padding:12px 13px;margin-bottom:10px;font-size:.92rem}
  .row .ic{font-size:1.15rem;line-height:1.3;flex:0 0 auto}
  .row b{color:var(--plum-deep)}
  .copybtn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:#efe6f6;color:#6b3d80;border:1px solid #d9c6ea;
    border-radius:10px;padding:7px 12px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit}
  .copybtn:active{transform:translateY(1px)}
  .navttl{display:flex;align-items:center;gap:8px;margin:14px 0 9px;color:var(--plum);font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em}
  .navttl::before,.navttl::after{content:"";height:1px;background:var(--line);flex:1}
  .nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .navbtn.full{grid-column:1/-1}
  .navbtn{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:12px 10px;
    font-weight:700;font-size:.9rem;text-decoration:none;border:1.5px solid transparent}
  .navbtn:active{transform:translateY(1px)}
  .navbtn.maps{background:#e6f1f4;color:#2d6b82;border-color:#bfe0ea}
  .navbtn.waze{background:#e3f4fb;color:#1583b5;border-color:#bbe4f3}
  .navbtn.bus{background:#e8f0e8;color:#3f7a4a;border-color:#c6e0c9}
  .navbtn.uber{background:#111;color:#fff}
  .navbtn.ride{background:#fff3e0;color:#c9671a;border-color:#f3cd9a}
  .cta{margin:18px 0 6px;text-align:center}
  .cta-lbl{font-size:.9rem;font-weight:700;color:var(--plum);margin-bottom:10px}
  .btn-main{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:17px;
    padding:19px 18px;font-family:inherit;font-weight:800;font-size:1.18rem;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#7a3f93,#8f2f83);box-shadow:0 12px 28px rgba(107,61,128,.4);animation:cpulse 2.2s ease-in-out infinite}
  @keyframes cpulse{0%,100%{box-shadow:0 12px 28px rgba(107,61,128,.4)}50%{box-shadow:0 12px 36px rgba(143,47,131,.6)}}
  @media (prefers-reduced-motion:reduce){.btn-main{animation:none}}
  .btn-g2{display:inline-block;margin-top:11px;color:#2d6b82;font-weight:600;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
  .ori{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px}
  .ori h2{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--plum);font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .ori ul{list-style:none}
  .ori li{position:relative;padding:7px 0 7px 22px;font-size:.9rem;color:#4a3242;border-bottom:1px solid #f4ecf1;line-height:1.4}
  .ori li:last-child{border-bottom:none}
  .ori li::before{content:"🔹";position:absolute;left:0;top:7px;font-size:.7rem}
  .ori li b{color:var(--plum-deep);font-weight:700}
  .ori.sub h2{color:#9a561f}
  .ori.sub li::before{content:"🏢"}
  .err{text-align:center;color:#9a2a2a;padding:30px 24px;font-size:.95rem}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);background:#5c2b56;color:#fff;
    padding:11px 20px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;transition:all .25s;pointer-events:none;z-index:9}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

    "UID:livia-"+Date.now()+"@central","DTSTAMP:"+fmtStamp(new Date()),
    "DTSTART:"+fmtLocal(dt.Y,dt.Mo,dt.D,dt.H,dt.Mi),
    "DTEND:"+fmtLocal(end.getFullYear(),end.getMonth()+1,end.getDate(),end.getHours(),end.getMinutes()),
    "SUMMARY:Consulta Dra. Livia Horovitz"+(pac?(" - "+pac):"")];
  if(loc) L.push("LOCATION:"+loc.replace(/,/g,"\\,").replace(/;/g,"\\;"));
  L.push("DESCRIPTION:"+desc.replace(/,/g,"\\,").replace(/;/g,"\\;"));
  L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Consulta amanhã - Dra. Livia Horovitz","TRIGGER:-P1D","END:VALARM");
  L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Consulta em 1 hora - Dra. Livia Horovitz","TRIGGER:-PT1H","END:VALARM");
  L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Consulta em 15 minutos - Dra. Livia Horovitz","TRIGGER:-PT15M","END:VALARM");
  L.push("END:VEVENT","END:VCALENDAR");
  return L.join("\r\n");
}
function isIOS(){ return /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function downloadICS(){
  var ics=buildICS();
  var blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  if(isIOS()){
    // iOS: abrir o arquivo (mesmo método do termo) → Safari oferece "Adicionar ao Calendário"
    var w=window.open(url,"_blank");
    if(!w){ window.location.href=url; }
    toast("Abrindo o calendário… toque em Adicionar 📅");
  } else {
    // Android/desktop: baixa o .ics (abre no Google Agenda ao tocar)
    var a=document.createElement("a"); a.href=url; a.download="Consulta-Dra-Livia.ics";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("Evento baixado 📅 toque no arquivo p/ adicionar");
  }
  setTimeout(function(){ URL.revokeObjectURL(url); },8000);
}
function googleUrl(){
  var jsd=new Date(dt.Y,dt.Mo-1,dt.D,dt.H,dt.Mi);
  var end=new Date(jsd.getTime()+30*60000);
  var dates=fmtLocal(dt.Y,dt.Mo,dt.D,dt.H,dt.Mi)+'/'+fmtLocal(end.getFullYear(),end.getMonth()+1,end.getDate(),end.getHours(),end.getMinutes());
  var oriTxt=ori.map(striptags);
  var desc="Orientações:\n• "+oriTxt.join("\n• ")+"\n\n⚠️ Tolerância de atraso: 5 minutos.";
  var u="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Consulta Dra. Livia Horovitz"+(pac?(" - "+pac):""))+"&dates="+dates+"&details="+encodeURIComponent(desc);
  if(uni && UNIT_GEO[uni]) u+="&location="+encodeURIComponent(UNIT_GEO[uni]);
  return u;
}
function mapsUrl(){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(geo||addr); }
function wazeUrl(){ return "https://waze.com/ul?q="+encodeURIComponent(geo||addr)+"&navigate=yes"; }
function busUrl(){ return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(geo||addr)+"&travelmode=transit"; }
function copyAddr(){
  var txt=(geo||addr);
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){toast("Endereço copiado ✅");}); }
  else { var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast("Endereço copiado ✅");}catch(e){} document.body.removeChild(ta); }
}

if(!dt){
  content.innerHTML='<div class="err">Não consegui ler a data da consulta. 😕<br>Peça para a secretária reenviar o link.</div>';
} else {
  var jsd=new Date(dt.Y,dt.Mo-1,dt.D,dt.H,dt.Mi);
  var wd=DIAS[jsd.getDay()]; wd=wd.charAt(0).toUpperCase()+wd.slice(1);
  var dstr=dt.D+" de "+MESES[dt.Mo-1]+" de "+dt.Y;
  var hstr=pad(dt.H)+"h"+(dt.Mi===0?"":pad(dt.Mi));
  var isOn=(uni==="Online");
  var html="";
  html+='<div class="greet">'+(pac?('Olá, <span>'+pac+'</span>! 💜<br>Sua consulta está marcada:'):('Sua consulta está marcada 💜')) +'</div>';
  html+='<div class="tolbig"><span class="ic">🚨</span><span class="tx">Tolerância de atraso: 5 minutos<small>Chegue com um tempinho de folga 😊</small></span></div>';
  html+='<div class="when"><div class="d">'+dstr+'</div><div class="h">⏰ '+hstr+'</div><div class="wd">'+wd+'</div></div>';
  if(uni){
    html+='<div class="row"><span class="ic">'+(isOn?'💻':'📍')+'</span><div><b>'+(isOn?'Atendimento online':uni)+'</b><br>'+addr+
      (isOn?'':('<br><button class="copybtn" id="btnCopy">📋 Copiar endereço</button>'))+'</div></div>';
  }
  if(uni && !isOn){
    html+='<div class="navttl">Como chegar</div>';
    html+='<div class="nav">'+
      '<a class="navbtn maps" id="btnMaps" target="_blank" rel="noopener">🗺️ Google Maps</a>'+
      '<a class="navbtn waze" id="btnWaze" target="_blank" rel="noopener">🚗 Waze</a>'+
      '<a class="navbtn bus full" id="btnBus" target="_blank" rel="noopener">🚌 Transporte público</a>'+
      '</div>';
  }
  html+='<div class="cta"><div class="cta-lbl">Adicione no seu celular 👇</div>'+
    '<button class="btn-main" id="btnIcs">➕ ADICIONAR AO CALENDÁRIO</button>'+
    '<a class="btn-g2" id="btnG" target="_blank" rel="noopener">ou usar o Google Agenda</a></div>';
  html+='<div class="ori"><h2>📋 Orientações para a consulta</h2><ul>'+ori.map(function(o){return '<li>'+o+'</li>';}).join('')+'</ul></div>';
  if(uni==="Barra da Tijuca"){
    html+='<div class="ori sub"><h2>🏢 Ao chegar na Barra (totem)</h2><ul>'+TOTEM.map(function(o){return '<li>'+o+'</li>';}).join('')+'</ul></div>';
  }
  content.innerHTML=html;
  document.getElementById("btnIcs").addEventListener("click",downloadICS);
  document.getElementById("btnG").href=googleUrl();
  if(uni && !isOn){
    document.getElementById("btnMaps").href=mapsUrl();
    document.getElementById("btnWaze").href=wazeUrl();
    document.getElementById("btnBus").href=busUrl();
    var bc=document.getElementById("btnCopy"); if(bc) bc.addEventListener("click",copyAddr);
  }
}
</script>
